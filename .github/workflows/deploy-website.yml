name: Deploy Website

on:
  push:
    paths:
      - 'README.md'
      - 'apis/**'
      - 'site/**'
      - 'scripts/parse_readme.py'
      - '.github/workflows/deploy-website.yml'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: agent-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.agent-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse APIs → apis.json
        run: python scripts/parse_readme.py --readme apis --output site/src/data/apis.json

      - name: Set ThanhNguyxnAgent commit identity
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-git-identity@da9d02544f60aeec92f8c851846ee3a587044beb

      - name: Commit and Push Count Updates
        run: |
          git add README.md site/index.html site/src/data/apis.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): auto-update API counts [skip ci]"
            git push origin main
          else
            echo "API counts are already current."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: site
        run: pnpm install

      - name: Build website
        working-directory: site
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ steps.agent-token.outputs.token }}
          user_name: "ThanhNguyxnAgent[bot]"
          user_email: "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          publish_dir: ./docs
          publish_branch: gh-pages

name: Script Tests

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/script-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/script-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-python.yml@efceff92eb1969fe344886c1d063497847e47026
    with:
      job_name: Python Regression Tests
      python_version: "3.11"
      cache: ""
      install_command: ""
      test_command: >-
        python -m unittest discover -s scripts/tests -v &&
        python -m py_compile
        scripts/check_pr_links.py
        scripts/pr_validation.py
        scripts/remove_dead_links.py

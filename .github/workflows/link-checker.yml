name: Link Checker

# Prevent overlapping scheduled and push checks from racing while updating the health dashboard.
concurrency:
  group: link-checker-${{ github.ref }}
  cancel-in-progress: false

on:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - "apis/**"
      - "scripts/**"
      - ".github/workflows/link-checker.yml"

  # Run on pull requests
  pull_request:
    paths:
      - "apis/**"
      - "scripts/**"
      - ".github/workflows/link-checker.yml"

  # Run daily at 00:00 UTC to catch broken links
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Mint repository-scoped remediation token
        id: app-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@2b5c5cad571ee93fd091e16e1734ebd819191e68
        with:
          profile: remediation
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Check only new links (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          APIDEX_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          APIDEX_DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
          APIDEX_VALIDATE_REMOVALS: ${{ startsWith(github.head_ref, 'agent-remediation/dead-api-incident-') }}
        run: |
          cd scripts
          python check_pr_links.py

      - name: Check all links (Daily Schedule / Push)
        if: github.event_name != 'pull_request'
        id: check
        run: |
          cd scripts
          echo "=== STAGE 1: Fast CLI Check ==="
          python check_links.py > output.txt 2>&1 || { cat output.txt; echo "::error::Stage 1 link check failed; refusing to publish a healthy report."; exit 1; }
          cat output.txt
          
          echo "=== STAGE 2: Playwright Verification ==="
          python verify_links_playwright.py > verify_output.txt 2>&1 || { cat verify_output.txt; echo "::error::Stage 2 verification failed; refusing to publish a healthy report."; exit 1; }
          cat verify_output.txt
          
          # Do not publish an all-zero dashboard when the scan did not finish.
          if [ ! -s link_check_report.txt ]; then
            echo "::error::Link checker did not produce link_check_report.txt."
            exit 1
          fi

          # Consume the final Stage 2 JSON, not human-readable text parsed with grep.
          python - <<'PY'
          import json
          import os
          import uuid

          with open("scripts/results.json", encoding="utf-8") as handle:
              results = json.load(handle)

          states = ("working", "protected", "warning", "error", "broken", "unknown")
          if not isinstance(results, dict) or any(not isinstance(results.get(key), list) for key in states):
              raise SystemExit("ERROR: results.json is missing a required classification list.")

          counts = {key: len(results[key]) for key in states}
          if sum(counts.values()) == 0:
              raise SystemExit("ERROR: results.json contains no checked endpoints; refusing to publish an empty dashboard.")

          scalar_outputs = {
              "broken_count": counts["broken"],
              "ok_count": counts["working"],
              "protected_count": counts["protected"],
              "warn_count": counts["warning"],
              "err_count": counts["error"],
              "unknown_count": counts["unknown"],
              "has_broken": "true" if counts["broken"] else "false",
          }
          list_files = {
              "broken_list": "scripts/broken_urls.txt",
              "error_list": "scripts/error_urls.txt",
              "warning_list": "scripts/warning_urls.txt",
              "unknown_list": "scripts/unknown_urls.txt",
              "protected_list": "scripts/protected_urls.txt",
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in scalar_outputs.items():
                  output.write(f"{key}={value}\n")
              for key, path in list_files.items():
                  try:
                      with open(path, encoding="utf-8") as handle:
                          value = handle.read()
                  except FileNotFoundError:
                      value = ""
                  delimiter = "APIDEX_" + uuid.uuid4().hex
                  output.write(f"{key}<<{delimiter}\n")
                  output.write(value)
                  if value and not value.endswith("\n"):
                      output.write("\n")
                  output.write(f"{delimiter}\n")
          PY

          # Read broken URLs list
          if [ -f broken_urls.txt ]; then
            BROKEN_LIST=$(cat broken_urls.txt)
          else
            BROKEN_LIST=""
          fi

          # Read error URLs list
          if [ -f error_urls.txt ]; then
            ERROR_LIST=$(cat error_urls.txt)
          else
            ERROR_LIST=""
          fi

          # Read warning URLs list
          if [ -f warning_urls.txt ]; then
            WARNING_LIST=$(cat warning_urls.txt)
          else
            WARNING_LIST=""
          fi

          # Read unknown URLs list
          if [ -f unknown_urls.txt ]; then
            UNKNOWN_LIST=$(cat unknown_urls.txt)
          else
            UNKNOWN_LIST=""
          fi

          # Read protected URLs list
          if [ -f protected_urls.txt ]; then
            PROTECTED_LIST=$(cat protected_urls.txt)
          else
            PROTECTED_LIST=""
          fi

          # Store lists as multiline outputs
          {
            echo "broken_list<<BROKEN_EOF"
            echo "$BROKEN_LIST"
            echo "BROKEN_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "error_list<<ERROR_EOF"
            echo "$ERROR_LIST"
            echo "ERROR_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "warning_list<<WARNING_EOF"
            echo "$WARNING_LIST"
            echo "WARNING_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "unknown_list<<UNKNOWN_EOF"
            echo "$UNKNOWN_LIST"
            echo "UNKNOWN_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "protected_list<<PROTECTED_EOF"
            echo "$PROTECTED_LIST"
            echo "PROTECTED_EOF"
          } >> $GITHUB_OUTPUT
      - name: Scan documentation for provider shutdown notices
        if: github.event_name != 'pull_request' && steps.check.outcome == 'success'
        id: shutdown-scan
        run: |
          set -euo pipefail
          python scripts/check_shutdown_signals.py --output scripts/shutdown_signals.json
          SIGNAL_COUNT=$(python -c "import json; print(json.load(open('scripts/shutdown_signals.json', encoding='utf-8')).get('shutdown_signal_count', 0))")
          INCONCLUSIVE_COUNT=$(python -c "import json; print(json.load(open('scripts/shutdown_signals.json', encoding='utf-8')).get('inconclusive_documentation_links', 0))")
          echo "signal_count=$SIGNAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "inconclusive_count=$INCONCLUSIVE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: |
            scripts/link_check_report.txt
            scripts/pr_link_check_report.txt
            scripts/broken_urls.txt
            scripts/error_urls.txt
            scripts/warning_urls.txt
            scripts/unknown_urls.txt
            scripts/protected_urls.txt
            scripts/shutdown_signals.json

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            try {
              let summary = '';
              if (fs.existsSync('scripts/pr_link_check_report.txt')) {
                summary = fs.readFileSync('scripts/pr_link_check_report.txt', 'utf8');
              } else if (fs.existsSync('scripts/link_check_report.txt')) {
                summary = fs.readFileSync('scripts/link_check_report.txt', 'utf8');
              } else {
                console.log('No report files found.');
                return;
              }
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔗 Link Check Results\n\n\`\`\`\n${summary}\n\`\`\`\n\n💡 **Note:** 401/403/418/429, server errors, timeouts and SSL failures are inconclusive—not proof that an API is dead.`
              });
            } catch (error) {
              console.log('Error commenting on PR:', error);
            }

      - name: Cancel pending cleanup PRs when no deletions remain confirmed
        if: github.event_name != 'pull_request' && steps.check.outcome == 'success' && steps.check.outputs.has_broken == 'false' && steps.check.outputs.protected_count == '0' && steps.check.outputs.warn_count == '0' && steps.check.outputs.err_count == '0' && steps.check.outputs.unknown_count == '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const pending = openPrs.filter(pr =>
              pr.base?.ref === 'main' &&
              pr.head?.ref?.startsWith('agent-remediation/dead-api-incident-') &&
              pr.head?.repo?.full_name === repository &&
              String(pr.user?.login || '').toLowerCase() === 'thanhnguyxnagent[bot]'
            );

            for (const pr of pending) {
              try {
                await github.graphql(
                  'mutation($pullRequestId: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) { pullRequest { id } } }',
                  { pullRequestId: pr.node_id }
                );
              } catch (error) {
                console.log(`No active native Auto-merge to cancel for #${pr.number}: ${error.message}`);
              }
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: 'automerge'
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, state: 'closed'
              });

              const issueMatch = String(pr.body || '').match(/Closes\s+#(\d+)/i);
              if (issueMatch) {
                const issueNumber = Number(issueMatch[1]);
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                if (issue.state === 'open') {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNumber,
                    body: `The latest successful Link Checker scan found no catalog URLs that remain confirmed dead. The pending deletion PR #${pr.number} has been closed and its \`automerge\` opt-in removed, so a recovered or inconclusive URL is retained.`
                  });
                  await github.rest.issues.update({
                    owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'completed'
                  });
                }
              }
              console.log(`Closed stale remediation PR #${pr.number}; no deletion candidates remain confirmed dead.`);
            }

      # 1. Reuse one open issue for each active confirmed-dead-link incident
      - name: Create Incident Issue
        if: github.event_name != 'pull_request' && steps.check.outputs.has_broken == 'true'
        id: create-incident
        uses: actions/github-script@v7
        env:
          BROKEN_COUNT: ${{ steps.check.outputs.broken_count }}
          BROKEN_LIST: ${{ steps.check.outputs.broken_list }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            const count = Number.parseInt(process.env.BROKEN_COUNT || '0', 10) || 0;
            const list = String(process.env.BROKEN_LIST || '').trim();
            const marker = '<!-- link-checker-incident -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let table = '| # | URL | Reason |\n|---|---|---|\n';
            list.split('\n').filter(line => line.trim()).forEach((line, index) => {
              const parts = line.split(' | ');
              table += `| ${index + 1} | ${parts[0] || line} | ${parts.slice(1).join(' | ') || 'Confirmed dead URL'} |\n`;
            });
            const body = [
              marker, '', `## 🔴 ${count} Confirmed Dead API Endpoint(s)`, '',
              `**Detected**: ${today}`, `**Run**: [#${context.runNumber}](${runUrl})`, '',
              table, '',
              'Only confirmed HTTP 404/410 or dead-DNS URLs from explicit API Endpoint cells are eligible for deletion, with the existing 500-row cap. Documentation URLs, developer portals and company websites are never probed or deleted as API evidence. 401/403/429, 5xx, timeouts, TLS failures, warnings and unknown statuses are never removed.',
              '',
              'A bot pull request will remove these entries. This incident remains open until that PR passes all configured checks and merges.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
              labels: 'incident', per_page: 100
            });
            const existing = issues.filter(issue => !issue.pull_request).filter(issue =>
              (issue.body || '').includes(marker) ||
              /^🔴 Incident: \d+ (?:confirmed dead link|broken link)/i.test(issue.title || '')
            ).sort((a, b) => Date.parse(b.updated_at || '') - Date.parse(a.updated_at || ''))[0];
            const title = `🔴 Incident: ${count} confirmed dead API endpoint${count === 1 ? '' : 's'} detected (${today})`;
            const response = existing
              ? await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, title, body })
              : await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['automated', 'incident'], body });
            core.setOutput('issue_number', response.data.number);
            core.setOutput('issue_url', response.data.html_url);

      # 2. Remove confirmed-dead API rows on a bot branch and submit a pull request
      - name: Set ThanhNguyxnAgent commit identity
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-git-identity@da9d02544f60aeec92f8c851846ee3a587044beb

      - name: Auto-Remediate Dead Links
        if: github.event_name != 'pull_request' && steps.check.outputs.has_broken == 'true'
        id: auto-remediate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.create-incident.outputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="agent-remediation/dead-api-incident-${ISSUE_NUMBER}"
          git config --global user.name "ThanhNguyxnAgent[bot]"
          git config --global user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git reset --hard origin/main

          python scripts/remove_dead_links.py --report scripts/broken_urls.txt --apply --max-delete 500
          REMOVED_COUNT=$(python -c "import json; print(json.load(open('scripts/removed_summary.json', encoding='utf-8')).get('count', 0))")
          echo "removed_count=$REMOVED_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$REMOVED_COUNT" -eq 0 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/parse_readme.py --readme apis --output site/src/data/apis.json
          git add apis/ README.md site/index.html site/src/data/apis.json
          if git diff --cached --quiet; then
            echo "::error::Dead rows were reported but no catalog diff was staged. Incident remains open."
            exit 1
          fi
          git switch -c "$BRANCH"
          git commit -m "fix(apis): auto-remove $REMOVED_COUNT confirmed dead API entries"

          EXISTING_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          if [ -n "$EXISTING_SHA" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$EXISTING_SHA" origin "HEAD:refs/heads/$BRANCH"
          else
            git push --set-upstream origin "$BRANCH"
          fi

          PR_TITLE="chore(apidex): auto-remove $REMOVED_COUNT confirmed dead API entries"
          PR_BODY=$(cat <<EOF
          ## Automated confirmed-dead API cleanup

          ThanhNguyxnAgent removed **$REMOVED_COUNT** catalog rows selected by the Link Checker’s confirmed-dead report.

          - Only confirmed HTTP 404/410 or dead-DNS URLs are candidates.
          - 401/403/429, 5xx, timeouts, TLS failures, warnings and unknown statuses are not deleted.
          - The existing \`--max-delete 500\` safety cap remains in force.
          - API Markdown, README and website data are regenerated together.
          - Central Auto-merge requires applicable link-check, Markdown lint and website build checks to succeed.

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Closes #$ISSUE_NUMBER
          EOF
          )
          ALL_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number,state,mergedAt --limit 50)
          PR_NUMBER=$(printf '%s' "$ALL_PRS" | jq -r '[.[] | select(.mergedAt == null)][0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_STATE=$(printf '%s' "$ALL_PRS" | jq -r --argjson number "$PR_NUMBER" '.[] | select(.number == $number) | .state')
            if [ "$PR_STATE" = "CLOSED" ]; then gh pr reopen "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          gh label create automated --repo "$GITHUB_REPOSITORY" --color EDEDED --description "Created by automation; assessed by the central Agent" --force
          gh label create automerge --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Explicitly authorized for Auto-merge after all configured checks pass" --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label automated --add-label automerge
          PR_URL=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"

      # 3. Close the incident only if the reported rows are already absent from main
      - name: Close Incident Issue
        if: github.event_name != 'pull_request' && steps.check.outputs.has_broken == 'true' && steps.auto-remediate.outputs.no_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumber = parseInt('${{ steps.create-incident.outputs.issue_number }}');
            if (!issueNumber) return;
            let summary = 'The reported API rows were already absent from the latest main branch.';
            try {
              const fs = require('fs');
              if (fs.existsSync('scripts/removed_summary.md')) summary = fs.readFileSync('scripts/removed_summary.md', 'utf8');
            } catch (error) { console.log('Could not read summary', error); }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
              body: `### ✅ Incident Resolved\n\nNo matching dead API rows remain in the latest main branch, so no PR was necessary.\n\n${summary}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
              state: 'closed', state_reason: 'completed'
            });

      # 4. Track explicit provider shutdown notices separately from endpoint failures.
      - name: Create or update provider shutdown review issue
        if: github.event_name != 'pull_request' && steps.shutdown-scan.outcome == 'success' && steps.shutdown-scan.outputs.signal_count != '0'
        id: shutdown-issue
        uses: actions/github-script@v7
        env:
          SHUTDOWN_REPORT_PATH: scripts/shutdown_signals.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.SHUTDOWN_REPORT_PATH, 'utf8'));
            const signals = report.shutdown_signals || [];
            if (!signals.length) {
              core.setOutput('issue_number', '');
              core.setOutput('issue_url', '');
              return;
            }

            const marker = '<!-- apidex-provider-shutdown-review -->';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const lines = [
              marker,
              '',
              '## Provider shutdown notice(s) detected in API documentation',
              '',
              'The documentation monitor found explicit provider-shutdown language. This is a **manual-review signal**, not automatic deletion evidence.',
              '',
              'A docs page can remain online after an API shuts down, and a docs page can fail while the API remains operational. Confirm the provider announcement and API lifecycle before changing the catalog.',
              '',
              '**Workflow run:** [#' + context.runNumber + '](' + runUrl + ')',
              ''
            ];

            for (const item of signals) {
              const names = (item.apis || []).map(api => api.name).join(', ') || 'Unknown API';
              const signal = item.shutdown_signal || {};
              const snippet = String(signal.snippet || signal.matched_text || '')
                .replace(/[`]/g, "'")
                .replace(/[\r\n]+/g, ' ')
                .slice(0, 420);
              lines.push('- **' + names + '**');
              lines.push('  - Documentation: ' + item.url);
              lines.push('  - Final URL: ' + (item.final_url || item.url));
              lines.push('  - HTTP status: ' + (item.status == null ? 'unknown' : item.status));
              lines.push('  - Signal: ' + String(signal.matched_text || signal.type || 'shutdown language detected'));
              if (snippet) lines.push('  - Evidence: ' + snippet);
              lines.push('');
            }

            lines.push('No catalog rows were deleted by this documentation scan. Once a shutdown is independently confirmed, the normal focused cleanup PR and CI validation process should be used.');
            const body = lines.join('\n');
            const title = '🟣 Provider shutdown review: ' + signals.length + ' documentation signal(s)';
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request && String(issue.body || '').includes(marker)
            );

            const response = existing
              ? await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body
                })
              : await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['automated', 'needs-review']
                });

            core.setOutput('issue_number', String(response.data.number));
            core.setOutput('issue_url', response.data.html_url);

      # 5. Update the Live Health Dashboard in GitHub Discussions (Announcements)
      - name: Update GitHub Discussion Live Dashboard
        if: github.event_name != 'pull_request' && !cancelled() && steps.check.outcome == 'success' && steps.shutdown-scan.outcome == 'success'
        uses: actions/github-script@v7
        env:
          HAS_BROKEN: ${{ steps.check.outputs.has_broken }}
          ALREADY_RESOLVED: ${{ steps.auto-remediate.outputs.no_changes }}
          REMEDIATION_PR: ${{ steps.auto-remediate.outputs.pr_url }}
          INCIDENT_ISSUE_NUMBER: ${{ steps.create-incident.outputs.issue_number }}
          BROKEN_COUNT: ${{ steps.check.outputs.broken_count }}
          OK_COUNT: ${{ steps.check.outputs.ok_count }}
          PROTECTED_COUNT: ${{ steps.check.outputs.protected_count }}
          WARN_COUNT: ${{ steps.check.outputs.warn_count }}
          ERR_COUNT: ${{ steps.check.outputs.err_count }}
          UNKNOWN_COUNT: ${{ steps.check.outputs.unknown_count }}
          BROKEN_LIST: ${{ steps.check.outputs.broken_list }}
          ERROR_LIST: ${{ steps.check.outputs.error_list }}
          WARNING_LIST: ${{ steps.check.outputs.warning_list }}
          UNKNOWN_LIST: ${{ steps.check.outputs.unknown_list }}
          PROTECTED_LIST: ${{ steps.check.outputs.protected_list }}
          SHUTDOWN_REPORT_PATH: scripts/shutdown_signals.json
          SHUTDOWN_ISSUE_URL: ${{ steps.shutdown-issue.outputs.issue_url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0];
            let shutdownReport = { shutdown_signals: [], inconclusive_documentation_links: 0 };
            try {
              shutdownReport = JSON.parse(fs.readFileSync(process.env.SHUTDOWN_REPORT_PATH, 'utf8'));
            } catch (error) {
              throw new Error('The documentation shutdown report is missing or invalid: ' + error.message);
            }
            const shutdownSignals = shutdownReport.shutdown_signals || [];
            const shutdownCount = shutdownSignals.length;
            const shutdownInconclusive = Number(shutdownReport.inconclusive_documentation_links || 0);
            const shutdownIssueUrl = String(process.env.SHUTDOWN_ISSUE_URL || '');
            const hasBroken = process.env.HAS_BROKEN === 'true';
            const alreadyResolved = process.env.ALREADY_RESOLVED === 'true';
            const remediationPr = String(process.env.REMEDIATION_PR || '');
            const incidentIssueNum = String(process.env.INCIDENT_ISSUE_NUMBER || '');
            const brokenCount = Number.parseInt(process.env.BROKEN_COUNT || '0', 10) || 0;
            const okCount = Number.parseInt(process.env.OK_COUNT || '0', 10) || 0;
            const protectedCount = Number.parseInt(process.env.PROTECTED_COUNT || '0', 10) || 0;
            const warnCount = Number.parseInt(process.env.WARN_COUNT || '0', 10) || 0;
            const errCount = Number.parseInt(process.env.ERR_COUNT || '0', 10) || 0;
            const unknownCount = Number.parseInt(process.env.UNKNOWN_COUNT || '0', 10) || 0;
            const currentBrokenList = String(process.env.BROKEN_LIST || '').trim();
            const currentErrorList = String(process.env.ERROR_LIST || '').trim();
            const currentWarningList = String(process.env.WARNING_LIST || '').trim();
            const currentUnknownList = String(process.env.UNKNOWN_LIST || '').trim();
            const currentProtectedList = String(process.env.PROTECTED_LIST || '').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const reviewCount = protectedCount + warnCount + errCount + unknownCount;
            let dynamicTitle = `🟢 Link Health Status: all recorded API endpoints responded successfully (${today})`;
            if (hasBroken && !alreadyResolved && remediationPr) {
              dynamicTitle = `🟠 Link Health Status: API endpoint cleanup PR awaiting checks (${today})`;
            } else if (hasBroken && !alreadyResolved) {
              dynamicTitle = `🔴 Link Health Status: ${brokenCount} confirmed dead API endpoint${brokenCount > 1 ? 's' : ''} detected (${today})`;
            } else if (shutdownCount > 0) {
              dynamicTitle = '🟣 Link Health Status: ' + shutdownCount + ' provider shutdown notice(s) need review (' + today + ')';
            } else if (reviewCount > 0) {
              dynamicTitle = `🟡 Link Health Status: no confirmed dead endpoints; ${reviewCount} need review (${today})`;
            }

            let shutdownSection = '';
            if (shutdownCount > 0) {
              const signalLines = [];
              shutdownSignals.forEach((item, index) => {
                const names = (item.apis || []).map(api => api.name).join(', ') || 'Unknown API';
                const signal = item.shutdown_signal || {};
                const evidence = String(signal.matched_text || signal.type || 'shutdown language detected')
                  .replace(/[`]/g, "'")
                  .replace(/[\r\n]+/g, ' ')
                  .slice(0, 220);
                signalLines.push((index + 1) + '. **' + names + '** — ' + item.url);
                signalLines.push('   - HTTP ' + (item.status == null ? 'unknown' : item.status) + '; evidence: ' + evidence);
              });
              shutdownSection = '### 🟣 Provider shutdown notices (' + shutdownCount + ')\n\n' +
                'These are explicit lifecycle statements found on documentation pages. They require maintainer review and are not automatically deleted.\n\n' +
                signalLines.join('\n') + '\n';
              if (shutdownIssueUrl) shutdownSection += '\n**Review issue:** ' + shutdownIssueUrl + '\n';
            } else {
              shutdownSection = '### 🟣 Provider shutdown notices\n\nNo explicit provider shutdown notices were detected in this documentation scan.\n';
            }
            if (shutdownInconclusive > 0) {
              shutdownSection += '\nDocumentation links with inconclusive fetch results: **' + shutdownInconclusive + '**. These are not treated as shutdown evidence.\n';
            }

            let brokenSection = '';
            if (hasBroken) {
              const brokenLines = currentBrokenList.split('\n').filter(l => l.trim());
              let brokenTable = '| # | URL | Reason |\n|---|---|---|\n';
              brokenLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const url = parts[0] || line;
                const reason = parts.slice(1).join(' | ') || '404';
                brokenTable += `| ${i + 1} | ${url} | ${reason} |\n`;
              });
              if (alreadyResolved) {
                brokenSection = `### ✅ Incident already resolved\n\nThe reported API rows were already absent from main.\n\n<details>\n<summary>🧹 Previously detected ${brokenCount} dead link(s)</summary>\n\n${brokenTable}\n</details>\n`;
              } else if (remediationPr) {
                brokenSection = `### 🧹 Automatic cleanup queued\n\n[Remediation PR](${remediationPr}) removes these confirmed-dead entries. It remains pending until the configured CI checks pass and the central Agent merges it.\n\n${brokenTable}\n`;
              } else {
                brokenSection = `### 💀 Broken Links (${brokenCount})\n\n${brokenTable}\n\n**Action needed:** Check the remediation workflow and incident issue.\n`;
              }
            } else {
              brokenSection = `### ✅ No Confirmed Dead API Endpoints\n\nNo endpoint was confirmed dead in this scan. Successful responses: ${okCount}; protected/inconclusive responses: ${protectedCount}; other responses needing review: ${warnCount + errCount + unknownCount}. A protected response does not confirm availability. Documentation URLs are excluded from endpoint health checks.\n`;
            }

            let errorSection = '';
            if (errCount > 0 && currentErrorList) {
              const errorLines = currentErrorList.split('\n').filter(l => l.trim());
              let errorTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              errorLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                errorTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              errorSection = `\n### ❌ Server Errors (${errCount})\n\n${errorTable}\n`;
            }

            let warningSection = '';
            if (warnCount > 0 && currentWarningList) {
              const warningLines = currentWarningList.split('\n').filter(l => l.trim());
              let warningTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              warningLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                warningTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              warningSection = `\n<details>\n<summary>⚠️ Warnings (${warnCount}) — click to expand</summary>\n\n${warningTable}\n</details>\n`;
            }

            let unknownSection = '';
            if (unknownCount > 0 && currentUnknownList) {
              const unknownLines = currentUnknownList.split('\n').filter(l => l.trim());
              let unknownTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              unknownLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                unknownTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              unknownSection = `\n<details>\n<summary>❓ Unknown (${unknownCount}) — click to expand</summary>\n\n${unknownTable}\n</details>\n`;
            }

            let protectedSection = '';
            if (protectedCount > 0 && currentProtectedList) {
              const protectedLines = currentProtectedList.split('\n').filter(l => l.trim());
              let protectedTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              protectedLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                protectedTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              protectedSection = `\n<details>\n<summary>🛡️ Protected (${protectedCount}) — click to expand</summary>\n\n${protectedTable}\n</details>\n`;
            }

            const statusIcon = hasBroken && !alreadyResolved
              ? (remediationPr ? '🟠' : '🔴')
              : shutdownCount > 0 ? '🟣' : reviewCount > 0 ? '🟡' : '🟢';
            const statusText = hasBroken && !alreadyResolved
              ? (remediationPr ? 'automatic endpoint cleanup PR awaiting checks' : `${brokenCount} confirmed dead API endpoint${brokenCount > 1 ? 's' : ''} detected`)
              : shutdownCount > 0
                ? shutdownCount + ' provider shutdown notice(s) need review'
                : reviewCount > 0
                  ? 'no confirmed dead endpoints; some responses need review'
                  : 'all recorded API endpoints responded successfully';

            const lines = [
              '<!-- apidex-link-health-dashboard -->',
              '',
              `## ${statusIcon} Link Health Status: ${statusText}`,
              '',
              `**Last checked**: ${today}`,
              `**Workflow run**: [#${context.runNumber}](${runUrl})`,
              `**Trigger**: \`${context.eventName}\``,
              '',
              '---',
              '',
              '### 📈 Summary',
              '',
              '| Category | Count | Description |',
              '|---|---|---|',
              `| ✅ Working | ${okCount} | HTTP 200 — responding correctly |`,
              `| 🛡️ Protected | ${protectedCount} | HTTP 401/403/418 — access restriction or WAF; availability not confirmed |`,
              `| ⚠️ Warning | ${warnCount} | Timeout/DNS/SSL issues (may be temporary) |`,
              `| ❌ Error | ${errCount} | Server errors (5xx) |`,
              `| ❓ Unknown | ${unknownCount} | Unrecognized status codes (needs review) |`,
              '| 🟣 Shutdown notices | ' + shutdownCount + ' | Explicit provider lifecycle language in documentation; maintainer review required |',
              `| 💀 Broken | ${alreadyResolved ? 0 : brokenCount} | HTTP 404/410/DNS dead — confirmed dead |`,
              '',
              `**Confirmed successful responses**: ${okCount} / ${okCount + protectedCount + warnCount + errCount + (alreadyResolved ? 0 : brokenCount) + unknownCount} recorded endpoints`,
              `**Protected / inconclusive**: ${protectedCount} endpoint(s); these do not count as confirmed healthy`,
              '',
              '---',
              '',
              shutdownSection,
              brokenSection,
              errorSection,
              warningSection,
              unknownSection,
              protectedSection,
              '',
              '---',
              '',
              '### 📋 How This Works',
              '',
              '- 🔄 This report is **automatically updated daily** at 00:00 UTC in GitHub Discussions',
              '- 🛡️ API endpoints with access protection (401/403/429) are reported as protected/inconclusive, never as dead.',
              '- 💀 Only confirmed 404/410 and dead-DNS URLs in the explicit API Endpoint column can enter the automated cleanup PR; documentation URLs never trigger API removal.',
              '- 🟣 Documentation links (including legacy 5-column entries) are monitored separately for explicit provider-shutdown notices; these create a review issue and never auto-delete catalog rows.',
              '- ❌ Server errors (5xx) may be temporary outages',
              '- ⚠️ Warnings include SSL/timeout issues that are often transient',
              `- 📦 Full report available as [workflow artifact](${runUrl})`,
              '',
              `> *Last updated by [Link Checker workflow](${runUrl}) on ${today}*`
            ];
            const body = lines.join('\n');

            const ANNOUNCEMENTS_CAT_ID = 'DIC_kwDOSWlqhM4C8fwq';
            const findQuery = `
              query($owner: String!, $name: String!, $catId: ID!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussions(first: 100, categoryId: $catId) {
                    nodes {
                      id
                      number
                      title
                      url
                      body
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(findQuery, {
              owner: context.repo.owner,
              name: context.repo.repo,
              catId: ANNOUNCEMENTS_CAT_ID
            });

            const discussions = result.repository.discussions.nodes || [];
            const targetDiscussion = discussions.find(d => String(d.body || '').includes('<!-- apidex-link-health-dashboard -->')) || discussions.find(d =>
              d.title.includes('Link Health Status') || d.title.includes('Live Dashboard')
            );

            if (targetDiscussion) {
              const updateMutation = `
                mutation($id: ID!, $title: String!, $body: String!) {
                  updateDiscussion(input: { discussionId: $id, title: $title, body: $body }) {
                    discussion {
                      id
                      url
                    }
                  }
                }
              `;
              await github.graphql(updateMutation, {
                id: targetDiscussion.id,
                title: dynamicTitle,
                body: body
              });
              console.log(`Updated Discussion #${targetDiscussion.number}: ${targetDiscussion.url}`);
            } else {
              const createMutation = `
                mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: { repositoryId: $repoId, categoryId: $catId, title: $title, body: $body }) {
                    discussion {
                      id
                      number
                      url
                    }
                  }
                }
              `;
              const createRes = await github.graphql(createMutation, {
                repoId: result.repository.id,
                catId: ANNOUNCEMENTS_CAT_ID,
                title: dynamicTitle,
                body: body
              });
              console.log(`Created Discussion #${createRes.createDiscussion.discussion.number}: ${createRes.createDiscussion.discussion.url}`);
            }

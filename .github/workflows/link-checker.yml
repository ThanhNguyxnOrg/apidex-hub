name: Link Checker

on:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - "apis/**"
      - "scripts/check_links.py"
      - ".github/workflows/link-checker.yml"

  # Run on pull requests
  pull_request:
    paths:
      - "apis/**"

  # Run daily at 00:00 UTC to catch broken links
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Check only new links (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          cd scripts
          python check_pr_links.py

      - name: Check all links (Daily Schedule / Push)
        if: github.event_name != 'pull_request'
        id: check
        run: |
          cd scripts
          echo "=== STAGE 1: Fast CLI Check ==="
          python check_links.py > output.txt 2>&1 || true
          cat output.txt
          
          echo "=== STAGE 2: Playwright Verification ==="
          python verify_links_playwright.py > verify_output.txt 2>&1 || true
          cat verify_output.txt
          
          # Parse report stats
          if [ -f link_check_report.txt ]; then
            BROKEN_COUNT=$(grep -oP "Broken: \K[0-9]+" link_check_report.txt || echo "0")
            OK_COUNT=$(grep -oP "Working: \K[0-9]+" link_check_report.txt || echo "0")
            PROTECTED_COUNT=$(grep -oP "Protected: \K[0-9]+" link_check_report.txt || echo "0")
            WARN_COUNT=$(grep -oP "Warnings: \K[0-9]+" link_check_report.txt || echo "0")
            ERR_COUNT=$(grep -oP "Errors: \K[0-9]+" link_check_report.txt || echo "0")
            UNKNOWN_COUNT=$(grep -oP "Unknown: \K[0-9]+" link_check_report.txt || echo "0")
            TOTAL=$(($(grep -oP "Working: \K[0-9]+" link_check_report.txt || echo 0) + $(grep -oP "Protected: \K[0-9]+" link_check_report.txt || echo 0)))
          else
            BROKEN_COUNT=0
            OK_COUNT=0
            PROTECTED_COUNT=0
            WARN_COUNT=0
            ERR_COUNT=0
            UNKNOWN_COUNT=0
            TOTAL=0
          fi

          echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT
          echo "ok_count=$OK_COUNT" >> $GITHUB_OUTPUT
          echo "protected_count=$PROTECTED_COUNT" >> $GITHUB_OUTPUT
          echo "warn_count=$WARN_COUNT" >> $GITHUB_OUTPUT
          echo "err_count=$ERR_COUNT" >> $GITHUB_OUTPUT
          echo "unknown_count=$UNKNOWN_COUNT" >> $GITHUB_OUTPUT
          echo "total_healthy=$TOTAL" >> $GITHUB_OUTPUT

          if [ "$BROKEN_COUNT" -gt 0 ]; then
            echo "has_broken=true" >> $GITHUB_OUTPUT
          else
            echo "has_broken=false" >> $GITHUB_OUTPUT
          fi

          # Read broken URLs list
          if [ -f broken_urls.txt ]; then
            BROKEN_LIST=$(cat broken_urls.txt)
          else
            BROKEN_LIST=""
          fi

          # Read error URLs list
          if [ -f error_urls.txt ]; then
            ERROR_LIST=$(cat error_urls.txt)
          else
            ERROR_LIST=""
          fi

          # Read warning URLs list
          if [ -f warning_urls.txt ]; then
            WARNING_LIST=$(cat warning_urls.txt)
          else
            WARNING_LIST=""
          fi

          # Read unknown URLs list
          if [ -f unknown_urls.txt ]; then
            UNKNOWN_LIST=$(cat unknown_urls.txt)
          else
            UNKNOWN_LIST=""
          fi

          # Read protected URLs list
          if [ -f protected_urls.txt ]; then
            PROTECTED_LIST=$(cat protected_urls.txt)
          else
            PROTECTED_LIST=""
          fi

          # Store lists as multiline outputs
          {
            echo "broken_list<<BROKEN_EOF"
            echo "$BROKEN_LIST"
            echo "BROKEN_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "error_list<<ERROR_EOF"
            echo "$ERROR_LIST"
            echo "ERROR_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "warning_list<<WARNING_EOF"
            echo "$WARNING_LIST"
            echo "WARNING_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "unknown_list<<UNKNOWN_EOF"
            echo "$UNKNOWN_LIST"
            echo "UNKNOWN_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "protected_list<<PROTECTED_EOF"
            echo "$PROTECTED_LIST"
            echo "PROTECTED_EOF"
          } >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: |
            scripts/link_check_report.txt
            scripts/broken_urls.txt
            scripts/error_urls.txt
            scripts/warning_urls.txt
            scripts/unknown_urls.txt
            scripts/protected_urls.txt

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            try {
              let summary = '';
              if (fs.existsSync('scripts/pr_link_check_report.txt')) {
                summary = fs.readFileSync('scripts/pr_link_check_report.txt', 'utf8');
              } else if (fs.existsSync('scripts/link_check_report.txt')) {
                summary = fs.readFileSync('scripts/link_check_report.txt', 'utf8');
              } else {
                console.log('No report files found.');
                return;
              }
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔗 Link Check Results\n\n\`\`\`\n${summary}\n\`\`\`\n\n💡 **Note:** 403/429 status codes indicate bot protection and are considered valid.`
              });
            } catch (error) {
              console.log('Error commenting on PR:', error);
            }

      # 1. Create Incident Issue if dead links are detected
      - name: Create Incident Issue
        if: github.event_name != 'pull_request' && steps.check.outputs.has_broken == 'true'
        id: create-incident
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            const brokenCount = parseInt('${{ steps.check.outputs.broken_count }}') || 0;
            const brokenList = `${{ steps.check.outputs.broken_list }}`.trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let brokenTable = '| # | URL | Reason |\n|---|---|---|\n';
            const lines = brokenList.split('\n').filter(l => l.trim());
            lines.forEach((l, i) => {
              const parts = l.split(' | ');
              const url = parts[0] || l;
              const reason = parts.slice(1).join(' | ') || 'Dead link (HTTP 404/DNS dead)';
              brokenTable += `| ${i + 1} | ${url} | ${reason} |\n`;
            });

            const issueBody = [
              `## 🔴 Incident: ${brokenCount} Broken Link(s) Detected`,
              '',
              `**Detection Date**: ${today}`,
              `**Workflow Run**: [#${context.runNumber}](${runUrl})`,
              '',
              '### 💀 Dead Links Detected',
              '',
              brokenTable,
              '',
              '🤖 *The automated remediation bot will now safely remove these entries from the repository and close this issue.*'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Incident: ${brokenCount} broken link${brokenCount > 1 ? 's' : ''} detected (${today})`,
              labels: ['automated', 'incident'],
              body: issueBody
            });

            console.log(`Created Incident Issue #${issue.data.number}: ${issue.data.html_url}`);
            core.setOutput('issue_number', issue.data.number);
            core.setOutput('issue_url', issue.data.html_url);

      # 2. Safely remove dead links and sync catalog
      - name: Auto-Remediate Dead Links
        if: github.event_name != 'pull_request' && steps.check.outputs.has_broken == 'true'
        id: auto-remediate
        run: |
          echo "=== Running remove_dead_links.py ==="
          python scripts/remove_dead_links.py --max-delete 500

          echo "=== Verifying Markdown and Catalog Integrity ==="
          python scripts/parse_readme.py --readme apis --output site/src/data/apis.json

          git config --global user.name "ThanhNguyxnAgent[bot]"
          git config --global user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"

          git add apis/ README.md site/index.html site/src/data/apis.json

          if ! git diff --staged --quiet; then
            ISSUE_NUM="${{ steps.create-incident.outputs.issue_number }}"
            git commit -m "fix(apis): auto-remove dead links (fixes #${ISSUE_NUM}) [skip ci]"
            git push origin main
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes staged. Nothing pushed."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      # 3. Close the Incident Issue automatically (no user mentions)
      - name: Close Incident Issue
        if: github.event_name != 'pull_request' && steps.check.outputs.has_broken == 'true' && steps.auto-remediate.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumber = parseInt('${{ steps.create-incident.outputs.issue_number }}');
            if (!issueNumber) return;

            let summaryText = 'Dead links were successfully removed from the API catalog.';
            try {
              const fs = require('fs');
              if (fs.existsSync('scripts/removed_summary.md')) {
                summaryText = fs.readFileSync('scripts/removed_summary.md', 'utf8');
              }
            } catch (e) {
              console.log('Could not read removed_summary.md', e);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### ✅ Auto-Remediation Completed\n\nThe automated link cleaner has safely removed the dead links and refreshed all counts and site data.\n\n${summaryText}\n\n*Incident resolved automatically.*`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

            console.log(`Successfully closed Incident Issue #${issueNumber}`);

      # 4. Update the Live Health Dashboard in GitHub Discussions (Announcements)
      - name: Update GitHub Discussion Live Dashboard
        if: github.event_name != 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            const hasBroken = '${{ steps.check.outputs.has_broken }}' === 'true';
            const wasRemediated = '${{ steps.auto-remediate.outputs.pushed }}' === 'true';
            const incidentIssueNum = '${{ steps.create-incident.outputs.issue_number }}';
            const brokenCount = parseInt('${{ steps.check.outputs.broken_count }}') || 0;
            const okCount = parseInt('${{ steps.check.outputs.ok_count }}') || 0;
            const protectedCount = parseInt('${{ steps.check.outputs.protected_count }}') || 0;
            const warnCount = parseInt('${{ steps.check.outputs.warn_count }}') || 0;
            const errCount = parseInt('${{ steps.check.outputs.err_count }}') || 0;
            const unknownCount = parseInt('${{ steps.check.outputs.unknown_count }}') || 0;
            const totalHealthy = parseInt('${{ steps.check.outputs.total_healthy }}') || 0;
            const currentBrokenList = `${{ steps.check.outputs.broken_list }}`.trim();
            const currentErrorList = `${{ steps.check.outputs.error_list }}`.trim();
            const currentWarningList = `${{ steps.check.outputs.warning_list }}`.trim();
            const currentUnknownList = `${{ steps.check.outputs.unknown_list }}`.trim();
            const currentProtectedList = `${{ steps.check.outputs.protected_list }}`.trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let dynamicTitle = `🟢 Link Health Status: All links healthy! 🎉 (${today})`;
            if (hasBroken && !wasRemediated) {
              dynamicTitle = `🔴 Link Health Status: ${brokenCount} broken link${brokenCount > 1 ? 's' : ''} detected (${today})`;
            }

            let brokenSection = '';
            if (hasBroken) {
              const brokenLines = currentBrokenList.split('\n').filter(l => l.trim());
              let brokenTable = '| # | URL | Reason |\n|---|---|---|\n';
              brokenLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const url = parts[0] || line;
                const reason = parts.slice(1).join(' | ') || '404';
                brokenTable += `| ${i + 1} | ${url} | ${reason} |\n`;
              });
              if (wasRemediated) {
                brokenSection = `### ✅ No Broken Links\n\nAll API links are responding correctly. 🎉\n\n<details>\n<summary>🧹 ${brokenCount} dead link(s) were automatically cleaned up in Incident #${incidentIssueNum} (click to expand)</summary>\n\n${brokenTable}\n</details>\n`;
              } else {
                brokenSection = `### 💀 Broken Links (${brokenCount})\n\n${brokenTable}\n\n**Action needed:** Review and update/remove these dead links.\n`;
              }
            } else {
              brokenSection = `### ✅ No Broken Links\n\nAll API links are responding correctly. Nothing to fix! 🎉\n`;
            }

            let errorSection = '';
            if (errCount > 0 && currentErrorList) {
              const errorLines = currentErrorList.split('\n').filter(l => l.trim());
              let errorTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              errorLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                errorTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              errorSection = `\n### ❌ Server Errors (${errCount})\n\n${errorTable}\n`;
            }

            let warningSection = '';
            if (warnCount > 0 && currentWarningList) {
              const warningLines = currentWarningList.split('\n').filter(l => l.trim());
              let warningTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              warningLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                warningTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              warningSection = `\n<details>\n<summary>⚠️ Warnings (${warnCount}) — click to expand</summary>\n\n${warningTable}\n</details>\n`;
            }

            let unknownSection = '';
            if (unknownCount > 0 && currentUnknownList) {
              const unknownLines = currentUnknownList.split('\n').filter(l => l.trim());
              let unknownTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              unknownLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                warningTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              unknownSection = `\n<details>\n<summary>❓ Unknown (${unknownCount}) — click to expand</summary>\n\n${unknownTable}\n</details>\n`;
            }

            let protectedSection = '';
            if (protectedCount > 0 && currentProtectedList) {
              const protectedLines = currentProtectedList.split('\n').filter(l => l.trim());
              let protectedTable = '| # | URL | Status | Note |\n|---|---|---|---|\n';
              protectedLines.forEach((line, i) => {
                const parts = line.split(' | ');
                const note = parts.slice(2).join(' | ');
                protectedTable += `| ${i + 1} | ${parts[0] || ''} | ${parts[1] || ''} | ${note || ''} |\n`;
              });
              protectedSection = `\n<details>\n<summary>🛡️ Protected (${protectedCount}) — click to expand</summary>\n\n${protectedTable}\n</details>\n`;
            }

            const statusIcon = (hasBroken && !wasRemediated) ? '🔴' : '🟢';
            const statusText = (hasBroken && !wasRemediated) ? `${brokenCount} broken link${brokenCount > 1 ? 's' : ''} detected` : 'All links healthy';

            const lines = [
              `## ${statusIcon} Link Health Status: ${statusText}`,
              '',
              `**Last checked**: ${today}`,
              `**Workflow run**: [#${context.runNumber}](${runUrl})`,
              `**Trigger**: \`${context.eventName}\``,
              '',
              '---',
              '',
              '### 📈 Summary',
              '',
              '| Category | Count | Description |',
              '|---|---|---|',
              `| ✅ Working | ${okCount} | HTTP 200 — responding correctly |`,
              `| 🛡️ Protected | ${protectedCount} | HTTP 403/429 — bot protection (API still works) |`,
              `| ⚠️ Warning | ${warnCount} | Timeout/DNS/SSL issues (may be temporary) |`,
              `| ❌ Error | ${errCount} | Server errors (5xx) |`,
              `| ❓ Unknown | ${unknownCount} | Unrecognized status codes (needs review) |`,
              `| 💀 Broken | ${wasRemediated ? 0 : brokenCount} | HTTP 404/410/DNS dead — confirmed dead |`,
              '',
              `**Healthy rate**: ${okCount + protectedCount} / ${okCount + protectedCount + warnCount + errCount + (wasRemediated ? 0 : brokenCount) + unknownCount} APIs healthy`,
              '',
              '---',
              '',
              brokenSection,
              errorSection,
              warningSection,
              unknownSection,
              protectedSection,
              '',
              '---',
              '',
              '### 📋 How This Works',
              '',
              '- 🔄 This report is **automatically updated daily** at 00:00 UTC in GitHub Discussions',
              '- 🛡️ APIs with bot protection (403/429) are counted as **healthy**',
              '- 💀 Confirmed 404/410 and DNS-dead domains are automatically removed via Incident issues',
              '- ❌ Server errors (5xx) may be temporary outages',
              '- ⚠️ Warnings include SSL/timeout issues that are often transient',
              `- 📦 Full report available as [workflow artifact](${runUrl})`,
              '',
              `> *Last updated by [Link Checker workflow](${runUrl}) on ${today}*`
            ];
            const body = lines.join('\n');

            const ANNOUNCEMENTS_CAT_ID = 'DIC_kwDOSWlqhM4C8fwq';
            const findQuery = `
              query($owner: String!, $name: String!, $catId: ID!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussions(first: 10, categoryId: $catId) {
                    nodes {
                      id
                      number
                      title
                      url
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(findQuery, {
              owner: context.repo.owner,
              name: context.repo.repo,
              catId: ANNOUNCEMENTS_CAT_ID
            });

            const discussions = result.repository.discussions.nodes || [];
            const targetDiscussion = discussions.find(d => 
              d.title.includes('Link Health Status') || d.title.includes('Live Dashboard')
            ) || discussions[0];

            if (targetDiscussion) {
              const updateMutation = `
                mutation($id: ID!, $title: String!, $body: String!) {
                  updateDiscussion(input: { discussionId: $id, title: $title, body: $body }) {
                    discussion {
                      id
                      url
                    }
                  }
                }
              `;
              await github.graphql(updateMutation, {
                id: targetDiscussion.id,
                title: dynamicTitle,
                body: body
              });
              console.log(`Updated Discussion #${targetDiscussion.number}: ${targetDiscussion.url}`);
            } else {
              const createMutation = `
                mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: { repositoryId: $repoId, categoryId: $catId, title: $title, body: $body }) {
                    discussion {
                      id
                      number
                      url
                    }
                  }
                }
              `;
              const createRes = await github.graphql(createMutation, {
                repoId: result.repository.id,
                catId: ANNOUNCEMENTS_CAT_ID,
                title: dynamicTitle,
                body: body
              });
              console.log(`Created Discussion #${createRes.createDiscussion.discussion.number}: ${createRes.createDiscussion.discussion.url}`);
            }
